<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#07120d">
    <title>Box Cricket — Physics Prototype</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell">
      <header class="scoreboard" aria-label="Match scoreboard">
        <div><span class="eyebrow">Physics prototype</span><strong id="score">0 / 0</strong></div>
        <div class="target"><span class="eyebrow">Target</span><strong>40</strong></div>
      </header>

      <canvas id="game" width="420" height="760" aria-label="Box Cricket playable court"></canvas>

      <section class="controls" aria-label="Prototype controls">
        <p id="status" aria-live="polite">Swipe forward in the court to play a shot.</p>
        <div class="timing-panel" aria-label="Shot timing gauge">
          <div class="timing-labels" aria-hidden="true"><span>EARLY</span><strong>PERFECT</strong><span>LATE</span></div>
          <div class="timing-gauge"><span id="timing-marker" class="timing-marker"></span></div>
        </div>
        <div class="button-row">
          <button id="loft" class="loft-button" type="button" aria-pressed="false">Loft: Off</button>
        </div>
        <p class="hint">Swipe forward from straight to 70° left or right. Turn on Loft before swiping for a higher, riskier shot.</p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
