<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#07120d">
    <title>Box Cricket — Physics Prototype</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell">
      <header class="scoreboard" aria-label="Match scoreboard">
        <div><span class="eyebrow">Physics prototype</span><strong id="score">0 / 0</strong></div>
        <div class="target"><span class="eyebrow">Target</span><strong>40</strong></div>
      </header>

      <canvas id="game" width="420" height="760" aria-label="Box Cricket playable court"></canvas>

      <section class="controls" aria-label="Prototype controls">
        <p id="status" aria-live="polite">Tap a lane in the court, then launch the ball.</p>
        <button id="launch" type="button">Launch ball</button>
        <p class="hint">Tap left, centre, or right in the court to aim. This tests scoring-wall physics before batting is added.</p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
